services:
  api:
    build: .
    image: france-essence-api
    container_name: france_essence_api
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:   
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: france_essence_db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - france-essence-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  france-essence-db:
